[workspace]
resolver = "2"
members = ["crates/civil-core", "crates/civil-mcp", "crates/civil-demo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
delaunator = ">=1.0, <1.1"
